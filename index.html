
<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/png" href="assets/logo.png" />

    <meta name="theme-color" content="#F600DF" />

    <meta
        name="description"
        content="AQLAM Stationery - مكتبة أقلام للأدوات المكتبية ولعب الأطفال"
    />

    <title>AQLAM Stationery</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css" />

    <!-- Services Layout -->
    <style>
        .services-card {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 13px;
            padding: 18px;

            background: rgba(255,255,255,0.95);
            border: 1px solid rgba(246,0,223,0.10);
            border-radius: 22px;

            box-shadow: 0 12px 35px rgba(72,30,66,0.065);
        }

        .service-item {
            position: relative;
            isolation: isolate;
            overflow: visible !important;

            min-height: 100px;
            padding: 12px 5px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;

            border: 1px solid #F9DDF5;
            border-radius: 17px;

            background: #FFF8FE;
            color: #BD00A9;

            font-family: "Cairo", sans-serif;
            font-size: 12px;
            font-weight: 800;

            cursor: pointer;
            transition: 0.35s cubic-bezier(.2,.8,.2,1);
            -webkit-tap-highlight-color: transparent;
        }

        .service-item i {
            font-size: 27px;
            transition: 0.35s ease;
        }

        .service-item:hover {
            transform: translateY(-5px);
            background: #FCEBFA;
            border-color: #F600DF;
            box-shadow: 0 9px 20px rgba(246,0,223,0.12);
        }

        .service-item:hover i {
            transform: scale(1.15) rotate(-5deg);
        }

        .service-item:active {
            transform: scale(.94);
        }

        .service-item:focus-visible {
            outline: 3px solid #F600DF;
            outline-offset: 4px;
        }

        @media (max-width: 380px) {
            .services-card {
                gap: 9px;
                padding: 13px;
            }

            .service-item {
                min-height: 90px;
                font-size: 11px;
            }

            .service-item i {
                font-size: 24px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .service-item,
            .service-item i {
                transition: none;
            }
        }
    </style>

    <!-- JavaScript -->
    <script src="js/script.js" defer></script>

</head>

<body>

<main class="main-container">

    <!-- HEADER -->

    <header class="hero">

        <div class="logo-wrapper">

            <div class="logo-flip">

                <div class="logo-face logo-face-front">

                    <img
                        src="assets/logo.png"
                        alt="AQLAM Stationery Logo"
                        class="logo"
                    />

                </div>

                <div class="logo-face logo-face-back" dir="rtl">

                    <span>
                        معاك على<br />
                        طريق النجاح
                    </span>

                </div>

            </div>

        </div>

        <h1>AQLAM Stationery</h1>

        <p>مكتبة أقلام</p>

    </header>


    <!-- SERVICES -->

    <section class="services-section">

        <h2 class="section-title">خدماتنا</h2>

        <div class="services-card">

            <!-- PRINTING -->

            <button
                type="button"
                class="service-item"
                data-effect="printing"
                aria-label="الطباعة"
            >
                <i class="fa-solid fa-print"></i>
                <span>الطباعة</span>
            </button>


            <!-- DOCUMENT COPYING -->

            <button
                type="button"
                class="service-item"
                data-effect="copy"
                aria-label="تصوير مستندات"
            >
                <i class="fa-solid fa-copy"></i>
                <span>تصوير مستندات</span>
            </button>


            <!-- BINDING -->

            <button
                type="button"
                class="service-item"
                data-effect="binding"
                aria-label="تغليف وتكعيب"
            >
                <i class="fa-solid fa-book-open"></i>
                <span>تغليف وتكعيب</span>
            </button>


            <!-- EXTERNAL BOOKS -->

            <button
                type="button"
                class="service-item"
                data-effect="books"
                aria-label="كتب خارجية"
            >
                <i class="fa-solid fa-book"></i>
                <span>كتب خارجية</span>
            </button>


            <!-- STATIONERY -->

            <button
                type="button"
                class="service-item"
                data-effect="stationery"
                aria-label="أدوات مكتبية"
            >
                <i class="fa-solid fa-pencil"></i>
                <span>أدوات مكتبية</span>
            </button>


            <!-- GAMES -->

            <button
                type="button"
                class="service-item"
                data-effect="games"
                aria-label="ألعاب"
            >
                <i class="fa-solid fa-puzzle-piece"></i>
                <span>ألعاب</span>
            </button>


            <!-- GIFTS -->

            <button
                type="button"
                class="service-item"
                data-effect="gifts"
                aria-label="هدايا"
            >
                <i class="fa-solid fa-gift"></i>
                <span>هدايا</span>
            </button>

        </div>

    </section>


    <!-- SOCIAL MEDIA -->

    <section class="social-section">

        <h2 class="section-title">تابعونا</h2>

        <div class="social-links">

            <a
                href="https://www.facebook.com/aqlam.stationery/"
                class="social-icon facebook"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Facebook"
                title="Facebook"

            </a>


            <a
                href="https://www.instagram.com/aqlamstationery/"
                class="social-icon instagram"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Instagram"
                title="Instagram"
            >
                <i class="fa-brands fa-instagram"></i>
            </a>


            <a

                class="social-icon whatsapp-channel"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="قناة واتساب أقلام"
                title="WhatsApp Channel"
            >
                <i class="fa-brands fa-whatsapp"></i>
            </a>

        </div>

    </section>


    <!-- BRANCHES -->

    <section class="branches-section">

        <h2 class="section-title">فروعنا</h2>

        <div class="branches-card">

            <!-- BRANCH 1 -->

            <div class="branch">

                    </span>

                        aria-label="واتساب فرع الواحة"
                        title="WhatsApp"

                        <i class="fa-brands fa-whatsapp"></i>
                    </a>

                        class="service-icon maps"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="موقع فرع الواحة"
                        title="Google Maps"
                    >
                        <i class="fa-solid fa-location-dot"></i>
                    </a>

                </div>

            </div>


            <div class="branch-divider"></div>


            <!-- BRANCH 2 -->

            <div class="branch">

                    <span class="branch-status new">
                        الفرع الجديد
                    </span>

                    <h3>فرع إيست بارك</h3>

                </div>


                <div class="branch-links">

                    <a
                        href="https://wa.me/201009153235"
                        class="service-icon whatsapp"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="واتساب فرع إيست بارك"
                        title="WhatsApp"
                    >
                        <i class="fa-brands fa-whatsapp"></i>
                    </a>


                    <a
                        href="https://www.google.com/maps/search/?api=1&query=30.03760682052661%2C31.362231485545635"
                        class="service-icon maps"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="موقع فرع إيست بارك"
                        title="Google Maps"
                    >
                        <i class="fa-solid fa-location-dot"></i>
                    </a>

                </div>

            </div>

        </div>

    </section>


    <!-- MANAGEMENT -->

            <!-- MANAGER MOSTAFA -->

                    >
                        <i class="fa-solid fa-phone"></i>

                    <button

        </div>

    </section>


    <!-- COPY NOTIFICATION -->

    <div

    <!-- FOOTER -->
