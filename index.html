<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="assets\logo.png" />
    <meta name="theme-color" content="#F600DF" />
    <meta
      name="description"
      content="AQLAM Stationery - مكتبة أقلام للأدوات المكتبية ولعب الأطفال"
    />

    <title>AQLAM Stationery</title>

    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css" />

    <!-- JavaScript -->
    <script src="js/script.js" defer></script>
  </head>

  <body>
    <main class="main-container">
      <!-- HEADER -->
      <header class="hero">
        <div class="logo-wrapper">
  <div class="logo-flip">

    <div class="logo-face logo-face-front">
      <img src="assets/logo.png" alt="AQLAM Stationery Logo" class="logo" />
    </div>

    <div class="logo-face logo-face-back" dir="rtl">
      <span>معاك على<br>طريق النجاح</span>
    </div>

  </div>
</div>

        <h1>AQLAM Stationery</h1>
        <p>مكتبة أقلام</p>
      </header>

      <!-- BRANCHES -->
      <section class="branches-section">
        <h2 class="section-title">فروعنا</h2>

        <!-- One Card For Both Branches -->
        <div class="branches-card">
          <!-- Branch 1 -->
          <div class="branch">
            <div class="branch-details">
              <span class="branch-status">الفرع الرئيسي</span>
              <h3>فرع الواحة</h3>
            </div>

            <div class="branch-links">
              <a
                href="https://wa.me/201115165609"
                class="service-icon whatsapp"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="واتساب فرع الواحة"
                title="WhatsApp"
              >
                <i class="fa-brands fa-whatsapp"></i>
              </a>

              <a
                href="https://www.google.com/maps/place/%D9%85%D9%83%D8%AA%D8%A8%D8%A9+%D8%A3%D9%82%D9%84%D8%A7%D9%85+%D9%84%D9%84%D8%A3%D8%AF%D9%88%D8%A7%D8%AA+%D8%A7%D9%84%D9%85%D9%83%D8%AA%D8%A8%D9%8A%D8%A9+%D9%88%D9%84%D8%B9%D8%A8+%D8%A7%D9%84%D8%A3%D8%B7%D9%81%D8%A7%D9%84%E2%80%AD/@30.0398056,31.3754722,17z/data=!4m12!1m5!3m4!2zMzDCsDAyJzIzLjMiTiAzMcKwMjInMzEuNyJF!8m2!3d30.0398056!4d31.3754722!3m5!1s0x14583d457c440391:0x8458ad21cbb7b8e1!8m2!3d30.0397027!4d31.375607!16s%2Fg%2F11jx0yn2qk?entry=ttu&g_ep=EgoyMDI2MTExMC4wIKXMDSoASAFQAw%3D%3D"
                class="service-icon maps"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="موقع فرع الواحة"
                title="Google Maps"
              >
                <i class="fa-solid fa-location-dot"></i>
              </a>
            </div>
          </div>

          <div class="branch-divider"></div>

          <!-- Branch 2 -->
          <div class="branch">
            <div class="branch-details">
              <span class="branch-status new">الفرع الجديد</span>
              <h3>فرع إيست بارك</h3>
            </div>

            <div class="branch-links">
              <a
                href="https://wa.me/201009153235"
                class="service-icon whatsapp"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="واتساب فرع إيست بارك"
                title="WhatsApp"
              >
                <i class="fa-brands fa-whatsapp"></i>
              </a>

              <a
                href="https://www.google.com/maps/search/?api=1&query=30.03760682052661%2C31.362231485545635"
                class="service-icon maps"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="موقع فرع إيست بارك"
                title="Google Maps"
              >
                <i class="fa-solid fa-location-dot"></i>
              </a>
            </div>
          </div>
        </div>
      </section>

      <!-- SOCIAL MEDIA -->
      <section class="social-section">
        <h2 class="section-title">تابعونا</h2>

        <div class="social-links">
          <a
            href="https://www.facebook.com/aqlam.stationery/"
            class="social-icon facebook"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Facebook"
            title="Facebook"
          >
            <i class="fa-brands fa-facebook-f"></i>
          </a>

          <a
            href="https://www.instagram.com/aqlamstationery/"
            class="social-icon instagram"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Instagram"
            title="Instagram"
          >
            <i class="fa-brands fa-instagram"></i>
          </a>

          <!-- WhatsApp Channel -->
          <a
            href="https://whatsapp.com/channel/0029VbCVDs16hENjyCQoum0S"
            class="social-icon whatsapp-channel"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="قناة واتساب أقلام"
            title="WhatsApp Channel"
          >
            <i class="fa-brands fa-whatsapp"></i>
          </a>
        </div>
      </section>

      <!-- MANAGEMENT -->
      <section class="management-section">
        <h2 class="section-title">الإدارة</h2>

        <div class="management-card">
          <!-- Manager Mohamed -->
          <div class="manager">
            <span class="manager-name">أ. محمد</span>

            <div class="manager-actions">
              <a
                href="tel:01006123004"
                class="manager-phone"
                aria-label="اتصال بأستاذ محمد"
              >
                <i class="fa-solid fa-phone"></i>
                <span dir="ltr">01006123004</span>
              </a>

              <button
                class="copy-btn"
                type="button"
                data-copy="01006123004"
                aria-label="نسخ رقم أستاذ محمد"
                title="نسخ الرقم"
              >
                <i class="fa-regular fa-copy"></i>
              </button>
            </div>
          </div>

          <div class="manager-divider"></div>

          <!-- Manager Mostafa -->
          <div class="manager">
            <span class="manager-name">أ. مصطفى</span>

            <div class="manager-actions">
              <a
                href="tel:01220309783"
                class="manager-phone"
                aria-label="اتصال بأستاذ مصطفى"
              >
                <i class="fa-solid fa-phone"></i>
                <span dir="ltr">01220309783</span>
              </a>

              <button
                class="copy-btn"
                type="button"
                data-copy="01220309783"
                aria-label="نسخ رقم أستاذ مصطفى"
                title="نسخ الرقم"
              >
                <i class="fa-regular fa-copy"></i>
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- Copy Notification -->
      <div id="copy-toast" class="copy-toast" role="status" aria-live="polite">
        تم نسخ الرقم بنجاح
      </div>

      <!-- FOOTER -->
      <footer class="footer">
        <p>© <span id="current-year"></span> AQLAM Stationery</p>

        <span>All Rights Reserved</span>
      </footer>
    </main>
  </body>
</html>
